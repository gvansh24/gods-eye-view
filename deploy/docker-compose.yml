# Run from the repo root:
#   sudo docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
# master_nginx (gvansh24/server-infra, servers/gods-eye-view.conf) publishes it on :8080.
name: gods-eye-view

services:
  gods-eye-view:
    container_name: gods_eye_view
    image: gods-eye-view:live
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
        CESIUM_ION_TOKEN: ${CESIUM_ION_TOKEN:-}
        MAPILLARY_CLIENT_TOKEN: ${MAPILLARY_CLIENT_TOKEN:-}
    restart: always
    env_file:
      - path: ../.env
        required: true
    environment:
      HOST: 0.0.0.0
      PORT: "4173"
    volumes:
      - gev-cache:/app/.gev-cache
    mem_limit: 1536m
    networks:
      - web-gateway

volumes:
  gev-cache:

networks:
  web-gateway:
    name: web-gateway
    external: true
